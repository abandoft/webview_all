name: platform_example
description: Demonstrates how to use the webview_all plugin.
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  webview_all:
    path: ../../webview_all
  webview_all_android:
    path: ../../webview_all_android
  webview_all_linux:
    path: ../../webview_all_linux
  webview_all_wkwebview:
    path: ../../webview_all_wkwebview

dependency_overrides:
  webview_all_android:
    path: ../../webview_all_android
  webview_all_wkwebview:
    path: ../../webview_all_wkwebview
  webview_platform_interface:
    path: ../../webview_platform_interface
  webview_all_linux:
    path: ../../webview_all_linux
  webview_all_windows:
    path: ../../webview_all_windows
  webview_all_ohos:
    path: ../../webview_all_ohos
  webview_all_web:
    path: ../../webview_all_web

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  webview_platform_interface:
    path: ../../webview_platform_interface

flutter:
  uses-material-design: true
  assets:
    - assets/sample_audio.ogg
    - assets/sample_video.mp4
    - assets/www/index.html
    - assets/www/styles/style.css
