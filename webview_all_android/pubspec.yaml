name: webview_all_android
description: A Flutter plugin that provides a WebView widget on Android.
repository: https://github.com/abandoft/webview_all
homepage: https://github.com/abandoft/webview_all
issue_tracker: https://github.com/abandoft/webview_all/issues
version: 1.4.1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

flutter:
  plugin:
    implements: webview_all
    platforms:
      android:
        package: com.abandoft.webview_all_android
        pluginClass: WebviewAllAndroidPlugin
        dartPluginClass: AndroidWebViewPlatform

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.10.0
  webview_platform_interface: ^1.4.1

dev_dependencies:
  build_runner: ^2.1.4
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  pigeon: ^26.1.10

topics:
  - webview
  - webview-flutter
  - android
  - html
  - browser
