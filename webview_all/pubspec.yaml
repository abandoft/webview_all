name: webview_all
version: 1.3.1
description: A Flutter WebView plugin with full-platform support that implements the webview_all platform interface.
repository: https://github.com/abandoft/webview_all
homepage: https://github.com/abandoft/webview_all
issue_tracker: https://github.com/abandoft/webview_all/issues

platforms:
  android:
  ios:
  macos:
  linux:
  windows:
  web:

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: webview_all_android
      ios:
        default_package: webview_all_wkwebview
      macos:
        default_package: webview_all_wkwebview
      linux:
        default_package: webview_all_linux
      windows:
        default_package: webview_all_windows
      ohos:
        default_package: webview_all_ohos
      web:
        default_package: webview_all_web

dependencies:
  flutter:
    sdk: flutter
  webview_all_android: ^1.3.1
  webview_all_wkwebview: ^1.3.1
  webview_platform_interface: ^1.3.1
  webview_all_windows: ^1.3.1
  webview_all_linux: ^1.3.1
  webview_all_ohos: ^1.3.1
  webview_all_web: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

topics:
  - html
  - webview
  - webview-flutter
