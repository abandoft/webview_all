name: Windows build and integration tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - '**/*.md'
  pull_request:
    paths-ignore:
      - docs/**
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows native build and integration (${{ matrix.flutter }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        flutter:
          - 3.35.7
          - 3.44.x
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true

      - name: Build Windows example
        working-directory: examples/platform
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --debug

      - name: Test shared environment configuration
        run: |
          cmake -S webview_all_windows/windows/test -B build/windows-native-tests -G "Visual Studio 17 2022" -A x64
          cmake --build build/windows-native-tests --config Debug
          ctest --test-dir build/windows-native-tests -C Debug --output-on-failure

      - name: Test custom storage and shared data cleanup
        if: matrix.flutter == '3.44.x'
        working-directory: examples/platform
        run: flutter test integration_test/webview_environment_test.dart -d windows

      - name: Run Windows integration tests
        if: matrix.flutter == '3.44.x'
        working-directory: examples/platform
        run: flutter test integration_test/webview_flutter_test.dart -d windows

      - name: Test session isolation, cleanup and titles
        if: matrix.flutter == '3.44.x'
        working-directory: examples/platform
        run: flutter test integration_test/webview_session_test.dart -d windows

      - name: Test native download handling and file safety
        if: matrix.flutter == '3.44.x'
        working-directory: examples/platform
        run: flutter test integration_test/webview_download_test.dart -d windows

      - name: Test JavaScript handlers and isolated worlds
        if: matrix.flutter == '3.44.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: flutter test integration_test/webview_javascript_test.dart -d windows

      - name: Test native history, text search and cookies
        if: matrix.flutter == '3.44.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: flutter test integration_test/webview_browser_test.dart -d windows

      - name: Test page exports and selective website-data clearing
        if: matrix.flutter == '3.44.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: flutter test integration_test/webview_capture_data_test.dart -d windows

      - name: Test fullscreen and renderer recovery
        if: matrix.flutter == '3.44.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: |
          flutter test integration_test/webview_fullscreen_test.dart -d windows
          flutter test integration_test/webview_process_test.dart -d windows

      - name: Test native child-window attachment
        if: matrix.flutter == '3.44.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: flutter test integration_test/webview_new_window_test.dart -d windows

      - name: Test application resource URLs and byte ranges
        if: matrix.flutter == '3.44.x'
        working-directory: examples/platform
        run: flutter test integration_test/webview_resource_test.dart -d windows

      - name: Test WebView2 scrolling after document rewrites
        if: matrix.flutter == '3.44.x'
        shell: powershell
        run: |
          $sdk = (Resolve-Path 'examples/platform/build/windows/x64/packages/Microsoft.Web.WebView2').Path
          & ./webview_all_windows/test/scroll_document_rewrite_test.ps1 -WebView2Sdk $sdk

      - name: Test profiles, navigation state and page tools
        if: matrix.flutter == '3.44.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: |
          flutter test integration_test/webview_advanced_browser_test.dart -d windows
          flutter test integration_test/webview_profile_management_test.dart -d windows

      - name: Test native rules, request decisions and custom schemes
        if: matrix.flutter == '3.44.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: flutter test integration_test/webview_network_test.dart -d windows
