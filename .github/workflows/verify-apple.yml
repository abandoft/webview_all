name: Apple builds and integration tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - '**/*.md'
  pull_request:
    paths-ignore:
      - docs/**
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: Apple native builds (${{ matrix.flutter }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flutter:
          - 3.35.7
          - 3.44.x
          - 3.47.x
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true

      - name: Resolve example
        working-directory: webview_all/example
        run: flutter pub get

      - name: Build iOS example
        if: matrix.flutter != '3.47.x'
        working-directory: webview_all/example
        run: flutter build ios --simulator --debug

      - name: Build macOS example
        working-directory: webview_all/example
        run: flutter build macos --debug

      - name: Run WKWebView native Swift tests
        if: matrix.flutter == '3.44.x'
        run: |
          python3 tool/add_swift_tests_to_xcode_target.py \
            webview_all/example/macos/Runner.xcodeproj \
            RunnerTests \
            webview_all_wkwebview/darwin/Tests
          xcodebuild test \
            -workspace webview_all/example/macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:RunnerTests \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Verify coexistence with the official Apple plugin
        if: matrix.flutter == '3.44.x'
        run: tool/test_plugin_coexistence.sh apple

      - name: Test WKWebView console after document rewrites
        if: matrix.flutter == '3.44.x'
        run: swift webview_all_wkwebview/test/console_document_rewrite_test.swift

      - name: Test native downloads and safe file destinations
        if: matrix.flutter == '3.44.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: |
          flutter pub get
          flutter test integration_test/webview_download_test.dart -d macos

      - name: Test JavaScript handlers and isolated worlds
        if: matrix.flutter == '3.44.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: flutter test integration_test/webview_javascript_test.dart -d macos

      - name: Test native history, text search and cookies
        if: matrix.flutter == '3.44.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: flutter test integration_test/webview_browser_test.dart -d macos

      - name: Test page exports and selective website-data clearing
        if: matrix.flutter == '3.44.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: flutter test integration_test/webview_capture_data_test.dart -d macos

      - name: Test profiles, page tools and native network control
        if: matrix.flutter == '3.47.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: |
          flutter test integration_test/webview_advanced_browser_test.dart -d macos
          flutter test integration_test/webview_profile_management_test.dart -d macos
          flutter test integration_test/webview_network_test.dart -d macos

      - name: Test native child-window attachment
        if: matrix.flutter == '3.44.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: flutter test integration_test/webview_new_window_test.dart -d macos

      - name: Test application resource URLs, ranges and streaming
        if: matrix.flutter == '3.44.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: flutter test integration_test/webview_resource_test.dart -d macos

      - name: Run macOS integration tests
        if: matrix.flutter == '3.44.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: |
          flutter pub get
          flutter test integration_test/webview_flutter_test.dart -d macos

      - name: Test session isolation, cleanup and titles
        if: matrix.flutter == '3.44.x'
        timeout-minutes: 15
        working-directory: examples/platform
        run: flutter test integration_test/webview_session_test.dart -d macos

  ios:
    name: iOS ${{ matrix.suite }} integration tests
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
          - native
          - flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.x
          channel: stable
          cache: true

      # XCTest and Flutter's VM-service discovery use separate simulator hosts.
      - name: Resolve and build native example
        if: matrix.suite == 'native'
        working-directory: webview_all/example
        run: |
          flutter pub get
          flutter build ios --simulator --debug

      - name: Resolve Flutter integration example
        if: matrix.suite == 'flutter'
        working-directory: examples/platform
        run: flutter pub get

      - name: Prepare iOS test simulator
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/webview-ios-simulator"
          import json
          import re
          import subprocess
          devices = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          iphones = [(runtime, device) for runtime, group in devices.items() if '.iOS-' in runtime
                     for device in group if device['name'].startswith('iPhone')]
          if not iphones:
              raise SystemExit('No available iOS simulator')
          runtime, device = max(iphones, key=lambda item:
              tuple(map(int, re.search(r'\.iOS-(\d+(?:-\d+)*)', item[0])[1].split('-'))))
          simulator = subprocess.check_output([
              'xcrun', 'simctl', 'create', 'webview_all_gesture_tests',
              device['deviceTypeIdentifier'], runtime], text=True).strip()
          print(simulator)
          PY
          simulator_id="$(cat "$RUNNER_TEMP/webview-ios-simulator")"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b

      - name: Run iOS native Swift tests
        if: matrix.suite == 'native'
        timeout-minutes: 15
        run: |
          simulator_id="$(cat "$RUNNER_TEMP/webview-ios-simulator")"
          python3 tool/add_swift_tests_to_xcode_target.py \
            webview_all/example/ios/Runner.xcodeproj \
            RunnerTests \
            webview_all_wkwebview/darwin/Tests
          xcodebuild test \
            -workspace webview_all/example/ios/Runner.xcworkspace \
            -scheme Runner -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:RunnerTests -parallel-testing-enabled NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Test iOS gestures
        if: matrix.suite == 'native'
        timeout-minutes: 20
        run: |
          simulator_id="$(cat "$RUNNER_TEMP/webview-ios-simulator")"
          cd examples/platform
          flutter pub get
          flutter build ios --simulator --debug --target test_driver/webview_gesture_app.dart
          cd ../..
          ruby tool/add_ios_test_target.rb \
            examples/platform/ios/Runner.xcodeproj Runner \
            examples/platform/ios/WebViewGestureUITests
          xcodebuild test \
            -workspace examples/platform/ios/Runner.xcworkspace \
            -scheme WebViewGestureUITests -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            FLUTTER_TARGET=test_driver/webview_gesture_app.dart \
            -only-testing:WebViewGestureUITests -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO -quiet

      # Avoid Flutter's simulator log-reader race: flutter/flutter#181771.
      - name: Test iOS Flutter integrations through XCTest
        if: matrix.suite == 'flutter'
        timeout-minutes: 30
        run: |
          simulator_id="$(cat "$RUNNER_TEMP/webview-ios-simulator")"
          ruby tool/add_ios_test_target.rb \
            examples/platform/ios/Runner.xcodeproj Runner \
            examples/platform/ios/WebViewIntegrationTests integration
          cd examples/platform
          flutter build ios --simulator --debug --target integration_test/webview_ios_test.dart
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme WebViewIntegrationTests -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            FLUTTER_TARGET=integration_test/webview_ios_test.dart \
            -only-testing:WebViewIntegrationTests -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/webview-ios-integration.xcresult" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Collect iOS simulator diagnostics
        if: failure()
        timeout-minutes: 2
        run: |
          if [[ -s "$RUNNER_TEMP/webview-ios-simulator" ]]; then
            simulator_id="$(cat "$RUNNER_TEMP/webview-ios-simulator")"
            xcrun simctl spawn "$simulator_id" log show --last 5m --style compact \
              --predicate 'process == "Runner" OR process == "SpringBoard"' \
              > "$RUNNER_TEMP/webview-ios-simulator.log" 2>&1 || true
          fi

      - name: Upload iOS simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.suite }}-simulator-log
          path: |
            ${{ runner.temp }}/webview-ios-simulator.log
            ${{ runner.temp }}/webview-ios-integration.xcresult
          if-no-files-found: ignore

      - name: Clean up iOS test simulator
        if: always()
        timeout-minutes: 3
        run: |
          if [[ -s "$RUNNER_TEMP/webview-ios-simulator" ]]; then
            simulator_id="$(cat "$RUNNER_TEMP/webview-ios-simulator")"
            xcrun simctl shutdown "$simulator_id" || true
            xcrun simctl delete "$simulator_id"
          fi
