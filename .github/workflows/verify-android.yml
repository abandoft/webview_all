name: Android build and native tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - '**/*.md'
  pull_request:
    paths-ignore:
      - docs/**
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android native tests and build (${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter:
          - 3.35.7
          - 3.44.x
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true

      - name: Test Android integration runner
        run: python3 -m unittest discover -s tool -p test_android_integration_runner.py

      - name: Prepare Android resource test image
        if: matrix.flutter == '3.44.x'
        run: bash tool/prepare_android_test_image.sh

      - name: Resolve example
        working-directory: examples/platform
        run: flutter pub get

      - name: Build Android example
        working-directory: examples/platform
        run: flutter build apk --debug

      - name: Run Android plugin unit tests
        working-directory: examples/platform
        run: android/gradlew -p android :webview_all_android:testDebugUnitTest

      - name: Verify coexistence with the official Android plugin
        if: matrix.flutter == '3.44.x'
        run: tool/test_plugin_coexistence.sh android

      - name: Enable KVM for resource integration tests
        if: matrix.flutter == '3.44.x'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test application resources in Android WebView
        if: matrix.flutter == '3.44.x'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: examples/platform
          script: |
            bash ../../tool/run_android_integration_test.sh integration_test/webview_resource_test.dart
            bash ../../tool/run_android_integration_test.sh integration_test/android_renderer_recovery_test.dart

      - name: Upload Android failure diagnostics
        if: failure() && matrix.flutter == '3.44.x'
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-diagnostics
          path: ${{ runner.temp }}/webview-all-android-diagnostics
          if-no-files-found: ignore
          retention-days: 1
