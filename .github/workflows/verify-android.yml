name: Android build and native tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - '**/*.md'
  pull_request:
    paths-ignore:
      - docs/**
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android native tests and build (${{ matrix.flutter }})
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.workers.max=2 -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
      ANDROID_INTEGRATION_TARGET: integration_test/android_resource_integration_test.dart
    strategy:
      fail-fast: false
      matrix:
        flutter:
          - 3.35.7
          - 3.44.x
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true

      - name: Test Android CI runners
        run: python3 -m unittest discover -s tool -p 'test_android_*runner.py'

      - name: Reclaim space for the Android emulator
        if: matrix.flutter == '3.44.x'
        run: |
          # These preinstalled runtimes are unused by this Android-only job.
          df -h . "$HOME" "$ANDROID_HOME"
          sudo rm -rf -- /usr/share/dotnet /usr/local/share/powershell
          df -h . "$HOME" "$ANDROID_HOME"

      - name: Prepare Android resource test image
        if: matrix.flutter == '3.44.x'
        run: bash tool/prepare_android_test_image.sh

      - name: Resolve example
        working-directory: examples/platform
        run: flutter pub get

      - name: Build Android example
        working-directory: examples/platform
        run: bash ../../tool/build_android_example.sh

      - name: Run Android plugin unit tests
        working-directory: examples/platform
        run: android/gradlew -p android :webview_all_android:testDebugUnitTest

      - name: Verify coexistence with the official Android plugin
        if: matrix.flutter == '3.44.x'
        run: tool/test_plugin_coexistence.sh android

      - name: Build Android integration APK before starting the emulator
        if: matrix.flutter == '3.44.x'
        working-directory: examples/platform
        run: |
          bash ../../tool/build_android_example.sh --target "$ANDROID_INTEGRATION_TARGET" \
            --dart-define=INTEGRATION_TEST_SHOULD_REPORT_RESULTS_TO_NATIVE=false
          android/gradlew -p android --stop

      - name: Enable KVM for resource integration tests
        if: matrix.flutter == '3.44.x'
        run: |
          df -h . "$HOME" "$ANDROID_HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test application resources in Android WebView
        if: matrix.flutter == '3.44.x'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader -no-snapshot -no-audio -no-boot-anim -memory 2560 -cores 2
          disable-animations: true
          working-directory: examples/platform
          script: |
            bash ../../tool/run_android_integration_test.sh "$ANDROID_INTEGRATION_TARGET" emulator-5554 build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Android failure diagnostics
        if: failure() && matrix.flutter == '3.44.x'
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-diagnostics
          path: |
            ${{ runner.temp }}/webview-all-android-diagnostics
            ${{ runner.temp }}/webview-all-android-build.*
          if-no-files-found: ignore
          retention-days: 1
