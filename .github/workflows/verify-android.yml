name: Android build and native tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - '**/*.md'
  pull_request:
    paths-ignore:
      - docs/**
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android native tests and build (${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter:
          - 3.35.7
          - 3.44.x
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true

      - name: Resolve example
        working-directory: examples/platform
        run: flutter pub get

      - name: Build Android example
        working-directory: examples/platform
        run: flutter build apk --debug

      - name: Run Android plugin unit tests
        working-directory: examples/platform
        run: android/gradlew -p android :webview_all_android:testDebugUnitTest

      - name: Verify coexistence with the official Android plugin
        if: matrix.flutter == '3.44.x'
        run: tool/test_plugin_coexistence.sh android

      - name: Enable KVM for integration tests
        if: matrix.flutter == '3.44.x'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test Android resources, downloads, JavaScript and browser operations
        if: matrix.flutter == '3.44.x'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: examples/platform
          script: |
            flutter test integration_test/webview_resource_test.dart -d emulator-5554
            flutter test integration_test/webview_javascript_test.dart -d emulator-5554
            flutter test integration_test/webview_browser_test.dart -d emulator-5554
            flutter test integration_test/webview_capture_data_test.dart -d emulator-5554
            flutter test integration_test/webview_advanced_browser_test.dart -d emulator-5554
            flutter test integration_test/webview_profile_management_test.dart -d emulator-5554
            flutter test integration_test/webview_network_test.dart -d emulator-5554
            flutter test integration_test/webview_new_window_test.dart -d emulator-5554
            flutter test integration_test/webview_fullscreen_test.dart -d emulator-5554
            flutter test integration_test/webview_process_test.dart -d emulator-5554
            flutter test integration_test/webview_download_test.dart -d emulator-5554
