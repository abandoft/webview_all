name: webview_all_wkwebview
description: A Flutter plugin that provides a WebView widget based on Apple's WKWebView control.
repository: https://github.com/abandoft/webview_all
homepage: https://github.com/abandoft/webview_all
issue_tracker: https://github.com/abandoft/webview_all/issues
version: 1.3.4

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

flutter:
  plugin:
    implements: webview_all
    platforms:
      ios:
        pluginClass: WebViewFlutterPlugin
        dartPluginClass: WebKitWebViewPlatform
        sharedDarwinSource: true
      macos:
        pluginClass: WebViewFlutterPlugin
        dartPluginClass: WebKitWebViewPlatform
        sharedDarwinSource: true

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.10.0
  path: ^1.8.0
  webview_platform_interface: ^1.3.4

dev_dependencies:
  build_runner: ^2.1.5
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  pigeon: ^26.1.4

topics:
  - html
  - webview
  - webview-flutter
